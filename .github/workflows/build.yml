name: Build node CI

on:
  push:
  # Callable from publish.yml, so nothing reaches npm without going through this first.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      # The monorepo currently resolves more than one Playwright version
      # (vitest's browser provider and @playwright/test do not agree), so the
      # browsers have to be fetched for each workspace that launches one.
      # Unifying the toolchain is tracked as part of the dependency-hygiene work.
      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium
          npm exec -w @open-cells/recipes-app -- playwright install --with-deps chromium firefox webkit
      - name: Lint
        run: npm run lint
      - run: npm run build --if-present
      - name: Run tests
        run: npm test

      # Keep the coverage reports of the runs that produce them, so a drop can be looked at
      # rather than guessed at. The suites fail on their own thresholds already.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/lcov.info
            packages/*/coverage/lcov-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/example/recipes-app/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
