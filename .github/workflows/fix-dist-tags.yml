name: Fix NPM dist-tags
on:
  workflow_dispatch:
jobs:
  fix-dist-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Repoint latest/rc dist-tags
        run: |
          set -e

          npm dist-tag add @open-cells/core@1.1.2 latest
          npm dist-tag add @open-cells/core@1.2.0-rc.0 rc

          npm dist-tag add @open-cells/core-plugin@1.2.2 latest
          npm dist-tag add @open-cells/core-plugin@1.2.3-rc.1 rc

          npm dist-tag add @open-cells/element-controller@1.0.4 latest
          npm dist-tag add @open-cells/element-controller@1.0.5-rc.0 rc

          npm dist-tag add @open-cells/page-mixin@1.2.2 latest
          npm dist-tag add @open-cells/page-mixin@1.2.3-rc.0 rc

          npm dist-tag add @open-cells/page-controller@1.0.4 latest
          npm dist-tag add @open-cells/page-controller@1.0.5-rc.0 rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: Verify result
        run: |
          for p in core core-plugin element-controller page-mixin page-controller; do
            echo "--- @open-cells/$p ---"
            npm view "@open-cells/$p" dist-tags --json
          done
