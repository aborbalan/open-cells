name: Publish to NPM
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  # Nothing reaches npm unless the suite is green. Publishing used to run straight after the
  # build with no tests at all.
  verify:
    uses: ./.github/workflows/build.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build --if-present

      # Every package is published the same way, so the loop replaces nine copies of the
      # same block. A version that is already on npm is skipped, which keeps a re-run
      # harmless — but a publish that *fails* now fails the job. It used to end in
      # `|| echo "Publish failed"`, so the workflow went green whatever happened.
      - name: Publish packages on NPM.js
        run: |
          set -euo pipefail
          for dir in core core-plugin element-controller page-controller page-mixin \
                     page-transitions localize create-app; do
            name=$(jq -r .name < "packages/$dir/package.json")
            version=$(jq -r .version < "packages/$dir/package.json")
            if npm info "$name@$version" > /dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
            else
              echo "Publishing $name@$version"
              npm publish --workspace "$name"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
