name: Publish to NPM
on:
  release:
    types: [created]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies and build
        run: |
          npm i --package-lock-only
          npm ci 
          npm run build --if-present
      - name: Publish core package on NPM.js
        working-directory: ./packages/core
        run: |
          VERSION=$(jq -r .version < package.json)
          if npm info @open-cells/core@$VERSION > /dev/null 2>&1; then
            echo "Version already published"
          else
            if [[ "$VERSION" == *-* ]]; then
              TAG=$(echo "$VERSION" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-([a-zA-Z]+).*/\1/')
            else
              TAG="latest"
            fi
            npm publish --tag "$TAG" || echo "Publish failed"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: Publish core-plugin package on NPM.js
